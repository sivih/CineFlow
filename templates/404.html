{% extends "base.html" %}

{% block title %}CineFlow | Page Not Found{% endblock %}

{% block content %}
<div style="text-align:center;padding:80px 20px;">
    <i class="fa fa-film" style="font-size:4rem;color:#ffaa3c;display:block;margin-bottom:20px;"></i>
    <h2 style="font-size:2.5rem;color:#ffaa3c;margin-bottom:10px;">404 — Not Found</h2>
    <p style="color:#666;font-size:1.1rem;margin-bottom:30px;">
        The movie or page you were looking for doesn't exist in our library.
    </p>
    <a href="{{ url_for('index') }}"
       style="background:#ffaa3c;color:#fff;padding:12px 28px;border-radius:6px;font-weight:600;text-decoration:none;">
        Back to Home
    </a>
</div>
{% endblock %}
